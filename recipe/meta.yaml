{% set name = "numba-progress" %}
{% set version = "1.1.3" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name | replace('-', '_') }}-{{ version }}.tar.gz
  sha256: 4cbdb99f911725c195711e0a0b06e5c89c8ef1126388798779619e11f07b114f

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - python >=3.6
    - setuptools
    - wheel
    - pip
  run:
    - python >=3.6
    - numpy
    - numba >=0.52
    - tqdm

test:
  imports:
    - numba_progress
  commands:
    - pip check
  requires:
    - pip

about:
  home: https://github.com/mortacious/numba-progress
  summary: A progress bar implementation for numba functions using tqdm
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - OliverEdy
