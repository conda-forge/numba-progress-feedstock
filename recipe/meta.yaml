{% set name = "numba-progress" %}
{% set version = "1.1.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name | replace('-', '_') }}-{{ version }}.tar.gz
  sha256: 9c860d5320181dc3140e37bc498861bcc3eb9b744a29ea335c3dc13769b2c4d3

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - python >=3.6
    - setuptools
    - wheel
    - pip
  run:
    - python >=3.6
    - numpy
    - numba >=0.52
    - tqdm

test:
  imports:
    - numba_progress
  commands:
    - pip check
  requires:
    - pip

about:
  home: https://github.com/mortacious/numba-progress
  summary: A progress bar implementation for numba functions using tqdm
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - OliverEdy
